[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/OrgPunk/cli"

[workspace.dependencies]
# scenarios
orgpunk-init = { path = "crates/init" }
orgpunk-sync = { path = "crates/sync" }
orgpunk-deploy = { path = "crates/deploy" }
orgpunk-env = { path = "crates/env" }
orgpunk-scratch = { path = "crates/scratch" }
# core
orgpunk-convert = { path = "crates/convert" }
orgpunk-sfapi = { path = "crates/sfapi" }
orgpunk-auth = { path = "crates/auth" }
orgpunk-config = { path = "crates/config" }
orgpunk-repo = { path = "crates/repo" }
# external
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
flate2 = "1"
gix = { version = "0.89", default-features = false, features = ["sha1", "status", "index"] }
globset = "0.4"
ignore = "0.4"
jsonwebtoken = "9"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
rand = "0.8"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
url = "2"
walkdir = "2"
webbrowser = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
